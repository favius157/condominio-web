<title>CondoGestión</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --accent:#5B4FE0;
  --accent-2:#8B7FF0;
  --accent-ink:#FFFFFF;
  --bg:#F5F4FB;
  --surface:#FFFFFF;
  --surface-2:#F0EEFA;
  --surface-3:#E9E6F7;
  --border:#E1DEF0;
  --text:#1E1B2E;
  --text-dim:#635F7A;
  --text-faint:#8B87A3;
  --success:#1B8F5F;
  --success-bg:#E1F5EB;
  --warning:#B4750B;
  --warning-bg:#FBF0D9;
  --danger:#D13856;
  --danger-bg:#FBE3E8;
  --info:#2D6FD1;
  --info-bg:#E4EDFB;
  --shadow:0 1px 2px rgba(30,27,46,.06), 0 8px 24px -12px rgba(30,27,46,.12);
  --shadow-lg:0 4px 12px rgba(30,27,46,.08), 0 24px 48px -16px rgba(30,27,46,.22);
  --radius:14px;
  --radius-sm:9px;
  font-family:'Inter',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --accent:#8377F5; --accent-2:#A79CFF; --accent-ink:#14121F;
    --bg:#131120; --surface:#1B1830; --surface-2:#221E3B; --surface-3:#2A2547;
    --border:#332E52; --text:#EFEDF9; --text-dim:#A9A4C6; --text-faint:#7A7599;
    --success:#3FCB8E; --success-bg:#123526; --warning:#E3A73C; --warning-bg:#3A2C0F;
    --danger:#F2708A; --danger-bg:#3B1520; --info:#6FA3F2; --info-bg:#122A47;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
    --shadow-lg:0 4px 16px rgba(0,0,0,.4), 0 24px 48px -16px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --accent:#8377F5; --accent-2:#A79CFF; --accent-ink:#14121F;
  --bg:#131120; --surface:#1B1830; --surface-2:#221E3B; --surface-3:#2A2547;
  --border:#332E52; --text:#EFEDF9; --text-dim:#A9A4C6; --text-faint:#7A7599;
  --success:#3FCB8E; --success-bg:#123526; --warning:#E3A73C; --warning-bg:#3A2C0F;
  --danger:#F2708A; --danger-bg:#3B1520; --info:#6FA3F2; --info-bg:#122A47;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
  --shadow-lg:0 4px 16px rgba(0,0,0,.4), 0 24px 48px -16px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:'Sora',system-ui,sans-serif;margin:0;text-wrap:balance;color:var(--text)}
p{margin:0}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px}
::selection{background:var(--accent);color:var(--accent-ink)}
a{color:inherit}
.num{font-variant-numeric:tabular-nums}

/* ---------- App shell ---------- */
#root{min-height:100%}
.app-shell{display:flex;min-height:100vh}
.sidebar{
  width:230px;flex:none;background:var(--surface);border-right:1px solid var(--border);
  display:flex;flex-direction:column;padding:18px 14px;gap:4px;
  position:sticky;top:0;height:100vh;overflow-y:auto;
}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 18px;margin-bottom:6px;border-bottom:1px solid var(--border)}
.brand-mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:flex;align-items:center;justify-content:center;color:var(--accent-ink);font-family:'Sora';font-weight:800;font-size:15px;flex:none}
.brand-name{font-family:'Sora';font-weight:700;font-size:15px;line-height:1.1}
.brand-sub{font-size:11px;color:var(--text-faint)}
.nav-link{
  display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--radius-sm);
  color:var(--text-dim);font-size:13.5px;font-weight:600;text-decoration:none;border:none;background:transparent;width:100%;text-align:left;
}
.nav-link:hover{background:var(--surface-2);color:var(--text)}
.nav-link.active{background:var(--accent);color:var(--accent-ink)}
.nav-link .ic{width:18px;text-align:center;flex:none;font-size:14px}
.nav-group-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-faint);padding:14px 10px 4px;font-weight:700}
.sidebar-foot{margin-top:auto;padding-top:12px;border-top:1px solid var(--border)}
.role-pill{font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;background:var(--surface-2);color:var(--text-dim);padding:6px 8px;border-radius:8px;font-weight:700;margin-bottom:8px}
.logout-btn{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface);color:var(--text-dim);font-size:12.5px;font-weight:600;width:100%}
.logout-btn:hover{color:var(--danger);border-color:var(--danger)}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:10;background:var(--surface);border-bottom:1px solid var(--border);
  padding:14px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding-top:calc(14px + env(safe-area-inset-top,0px));
}
.topbar-title{font-family:'Sora';font-weight:700;font-size:19px}
.topbar-sub{font-size:12.5px;color:var(--text-faint);margin-top:1px}
.topbar-right{display:flex;align-items:center;gap:10px}
.icon-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--border);background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--text-dim)}
.icon-btn:hover{background:var(--surface-2)}
.menu-btn{display:none}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--surface-3);color:var(--accent);display:flex;align-items:center;justify-content:center;font-family:'Sora';font-weight:700;font-size:13px;flex:none}

.content{padding:22px 24px 60px;max-width:1280px;width:100%;margin:0 auto}
.view-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.view-head h2{font-size:21px}
.view-head .desc{font-size:13px;color:var(--text-faint);margin-top:3px}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:13.5px;font-weight:600;transition:background .12s}
.btn:hover{background:var(--surface-2)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-primary:hover{filter:brightness(1.06)}
.btn-danger{color:var(--danger);border-color:var(--danger)}
.btn-danger:hover{background:var(--danger-bg)}
.btn-sm{padding:6px 10px;font-size:12.5px;border-radius:8px}
.btn-ghost{border-color:transparent;background:transparent}
.btn-ghost:hover{background:var(--surface-2)}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* ---------- Cards / KPI ---------- */
.grid{display:grid;gap:14px}
.kpi-grid{grid-template-columns:repeat(auto-fit,minmax(190px,1fr));margin-bottom:20px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
.kpi{display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden}
.kpi-top{display:flex;justify-content:space-between;align-items:flex-start}
.kpi-label{font-size:12px;color:var(--text-faint);font-weight:600}
.kpi-ic{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;flex:none}
.kpi-value{font-family:'Sora';font-size:24px;font-weight:700}
.kpi-trend{font-size:11.5px;font-weight:600;display:flex;align-items:center;gap:4px}
.section-title{font-family:'Sora';font-weight:700;font-size:15px;margin-bottom:12px}
.two-col{grid-template-columns:1.3fr 1fr}
@media(max-width:900px){.two-col{grid-template-columns:1fr}}

/* ---------- Badges ---------- */
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;font-size:11.5px;font-weight:700}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.badge-success{background:var(--success-bg);color:var(--success)}
.badge-warning{background:var(--warning-bg);color:var(--warning)}
.badge-danger{background:var(--danger-bg);color:var(--danger)}
.badge-info{background:var(--info-bg);color:var(--info)}
.badge-neutral{background:var(--surface-3);color:var(--text-dim)}
.tag-soon{background:var(--surface-3);color:var(--text-faint);font-size:10px;font-weight:700;padding:2px 7px;border-radius:6px;letter-spacing:.02em}

/* ---------- Table ---------- */
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:560px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-faint);font-weight:700;padding:11px 14px;border-bottom:1px solid var(--border);background:var(--surface-2);white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--surface-2)}
.cell-actions{display:flex;gap:6px;justify-content:flex-end}
.muted{color:var(--text-faint)}
.empty-row{text-align:center;color:var(--text-faint);padding:30px 14px}

/* ---------- Forms ---------- */
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:13px}
.field label{font-size:12.5px;font-weight:600;color:var(--text-dim)}
.field input,.field select,.field textarea{
  padding:9px 11px;border:1px solid var(--border);border-radius:9px;background:var(--bg);color:var(--text);width:100%;
}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:480px){.field-row{grid-template-columns:1fr}}
.hint{font-size:11.5px;color:var(--text-faint)}

/* ---------- Modal ---------- */
.modal-backdrop{position:fixed;inset:0;background:rgba(20,18,31,.5);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:100;overflow-y:auto}
.modal{background:var(--surface);border-radius:16px;width:100%;max-width:480px;box-shadow:var(--shadow-lg);border:1px solid var(--border)}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--border)}
.modal-head h3{font-size:16px}
.modal-body{padding:18px}
.modal-foot{padding:14px 18px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}

/* ---------- Toast ---------- */
.toast-stack{position:fixed;bottom:18px;right:18px;display:flex;flex-direction:column;gap:8px;z-index:200;max-width:320px}
.toast{background:var(--text);color:var(--bg);padding:11px 14px;border-radius:10px;font-size:13px;font-weight:600;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:8px;animation:toastIn .18s ease-out}
@keyframes toastIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

/* ---------- Login ---------- */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:
  radial-gradient(circle at 15% 10%, color-mix(in srgb, var(--accent) 16%, transparent), transparent 55%),
  radial-gradient(circle at 85% 90%, color-mix(in srgb, var(--accent-2) 14%, transparent), transparent 55%),
  var(--bg);
}
.login-card{width:100%;max-width:760px}
.login-head{text-align:center;margin-bottom:28px}
.login-mark{width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:flex;align-items:center;justify-content:center;color:var(--accent-ink);font-family:'Sora';font-weight:800;font-size:22px;margin:0 auto 14px}
.role-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:720px){.role-grid{grid-template-columns:1fr}}
.role-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;text-align:left;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow)}
.role-card:hover{border-color:var(--accent);transform:translateY(-2px)}
.role-card{transition:transform .12s, border-color .12s}
.role-ic{width:40px;height:40px;border-radius:11px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-size:18px}
.role-card h3{font-size:15px}
.role-card p{font-size:12.5px;color:var(--text-faint);line-height:1.5}
.role-enter{font-size:12.5px;font-weight:700;color:var(--accent);display:flex;align-items:center;gap:5px;margin-top:auto}
.login-foot{text-align:center;margin-top:22px;font-size:11.5px;color:var(--text-faint)}

/* ---------- misc ---------- */
.progress{height:7px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.progress > div{height:100%;border-radius:99px;background:var(--accent)}
.bar-chart{display:flex;align-items:flex-end;gap:6px;height:140px;padding-top:8px}
.bar-chart .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bar-chart .stack{width:100%;max-width:26px;display:flex;flex-direction:column-reverse;border-radius:4px 4px 0 0;overflow:hidden}
.bar-chart .lbl{font-size:10px;color:var(--text-faint);font-weight:600}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--text-dim);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:3px;display:inline-block}
.donut-wrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.donut{width:120px;height:120px;border-radius:50%;flex:none}
.avail-list{display:flex;flex-direction:column;gap:10px}
.avail-item{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border:1px solid var(--border);border-radius:10px}
.notice-banner{background:var(--info-bg);color:var(--info);border-radius:10px;padding:10px 13px;font-size:12.5px;font-weight:600;margin-bottom:16px;display:flex;gap:8px;align-items:flex-start}
.divider{height:1px;background:var(--border);margin:16px 0}
.list-comm{display:flex;flex-direction:column;gap:12px}
.comm-item{border:1px solid var(--border);border-radius:12px;padding:13px 14px}
.comm-item h4{font-size:14px;margin-bottom:4px}
.comm-item .meta{font-size:11.5px;color:var(--text-faint);margin-bottom:7px;display:flex;gap:8px;align-items:center}
.comm-item p{font-size:13px;color:var(--text-dim);line-height:1.5}
.stat-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px}
.stat-row:last-child{border-bottom:none}
.mobile-tabbar{display:none}

@media(max-width:860px){
  .sidebar{position:fixed;left:0;top:0;bottom:0;z-index:60;transform:translateX(-100%);transition:transform .18s;box-shadow:var(--shadow-lg)}
  .sidebar.open{transform:translateX(0)}
  .menu-btn{display:flex}
  .sidebar-overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:50}
  .content{padding:16px 14px 70px}
  .topbar{padding:12px 14px;padding-top:calc(12px + env(safe-area-inset-top,0px))}
}
</style>

<div id="root"></div>
<div id="toast-stack" class="toast-stack"></div>

<script>
(function(){
"use strict";

/* ============================= DB LAYER ============================= */
var DB_KEY = "condo_demo_db_v1";
var SESSION_KEY = "condo_demo_session_v1";

function uid(p){ return (p||"id") + "_" + Math.random().toString(36).slice(2,9); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function addDays(iso,n){ var d=new Date(iso+"T00:00:00"); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
function addMonths(iso,n){ var d=new Date(iso+"T00:00:00"); d.setMonth(d.getMonth()+n); return d.toISOString().slice(0,10); }
function fmtBs(n){ n = Number(n)||0; return "Bs " + n.toLocaleString("es-BO",{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fmtDate(iso){ if(!iso) return "—"; var d=new Date(iso+"T00:00:00"); return d.toLocaleDateString("es-BO",{day:"2-digit",month:"short",year:"numeric"}); }
function monthLabel(iso){ var d=new Date(iso+"T00:00:00"); return d.toLocaleDateString("es-BO",{month:"short"}).replace(".",""); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }

function seedDB(){
  var today = todayISO();
  var torres = [
    {id:"tA", nombre:"Torre A"},
    {id:"tB", nombre:"Torre B"}
  ];
  var deptoDefs = [
    ["tA","1","101",62,true], ["tA","1","102",58,true],
    ["tA","2","201",74,true], ["tA","2","202",74,false],
    ["tA","3","301",90,true], ["tA","3","302",90,true],
    ["tB","1","101",62,true], ["tB","1","102",58,true],
    ["tB","2","201",74,true], ["tB","2","202",74,true],
    ["tB","3","301",90,false],["tB","3","302",96,true]
  ];
  var totalSup = deptoDefs.reduce(function(a,d){return a+d[3];},0);
  var departamentos = deptoDefs.map(function(d,i){
    return {
      id:"d"+(i+1), torreId:d[0], piso:d[1], numero:d[2],
      superficie:d[3], coeficiente: +(d[3]/totalSup*100).toFixed(2),
      estado: d[4] ? "ocupado" : "vacio",
      propietarioId:null
    };
  });
  var nombres = ["Mariana Quispe","Jorge Fernández","Carla Rojas","Luis Mamani","Andrea Salazar",
    "Ricardo Paz","Daniela Vargas","Esteban Condori","Patricia Flores","Diego Choque"];
  var propietarios = nombres.map(function(n,i){
    var parts = n.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").split(" ");
    return {
      id:"p"+(i+1), nombre:n, ci: (4500000+i*13721)+"",
      telefono:"7"+(1000000+i*98213), email: parts[0]+"."+parts[1]+"@correo.com",
      tipo: i%5===0 ? "residente" : "propietario", activo:true
    };
  });
  var ocupados = departamentos.filter(function(d){return d.estado==="ocupado";});
  ocupados.forEach(function(d,i){ d.propietarioId = propietarios[i % propietarios.length].id; });

  var cuotas = [];
  var pagos = [];
  var mesesAtras = [3,2,1,0];
  ocupados.forEach(function(d,di){
    mesesAtras.forEach(function(m){
      var periodo = addMonths(today,-m).slice(0,7);
      var monto = 350;
      var recargo = 0;
      var cid = uid("c");
      var esMorosoSim = (di % 4 === 1) && m <= 1;
      var pagadoTotal = !esMorosoSim;
      var montoPagado = 0;
      var estado = "pendiente";
      if(m>0){
        recargo = esMorosoSim ? 35 : 0;
      }
      if(pagadoTotal){
        montoPagado = monto + recargo; estado="pagado";
      } else if(di % 4 === 1 && m === 0){
        montoPagado = 150; estado="parcial"; recargo = 0;
      } else if(esMorosoSim){
        montoPagado = 0; estado="pendiente";
      }
      cuotas.push({
        id:cid, departamentoId:d.id, concepto:"ordinaria", periodo:periodo,
        monto:monto, recargo:recargo, montoPagado:montoPagado, estado:estado,
        fechaVencimiento: addDays(periodo+"-05",0)
      });
      if(montoPagado>0){
        pagos.push({id:uid("pg"), cuotaId:cid, departamentoId:d.id, monto:montoPagado,
          fecha: addDays(periodo+"-08",Math.floor(Math.random()*6)), metodo: di%2? "Transferencia":"Efectivo"});
      }
    });
  });
  // extraordinaria para dos deptos
  [ocupados[2], ocupados[5]].forEach(function(d){
    cuotas.push({id:uid("c"), departamentoId:d.id, concepto:"extraordinaria", periodo:today.slice(0,7),
      monto:200, recargo:0, montoPagado:0, estado:"pendiente", fechaVencimiento: addDays(today,10)});
  });
  // multa
  cuotas.push({id:uid("c"), departamentoId:ocupados[1].id, concepto:"multa", periodo:today.slice(0,7),
    monto:80, recargo:0, montoPagado:0, estado:"pendiente", fechaVencimiento: addDays(today,5),
    detalle:"Ruido fuera de horario"});

  var caja = [];
  var catIngreso = ["Cobranza cuotas","Cobranza multas","Otros ingresos"];
  var catEgreso = ["Limpieza áreas comunes","Seguridad","Jardinería","Electricidad común","Mantenimiento ascensor","Honorarios administración","Insumos"];
  for(var m=5;m>=0;m--){
    var base = addMonths(today,-m).slice(0,7);
    var ingresoTot = 2600 + Math.round(Math.random()*500);
    caja.push({id:uid("cj"),tipo:"ingreso",categoria:catIngreso[0],concepto:"Cobranza cuotas ordinarias "+base,

  var overlay = document.getElementById("sidebar-overlay");
  if(menuBtn){
    menuBtn.addEventListener("click", function(){ sidebar.classList.add("open"); overlay.hidden=false; });

  }
  var themeBtn = document.getElementById("theme-btn");

function toggleTheme(){
  var el = document.documentElement;
  var cur = el.getAttribute("data-theme");
  if(cur==="dark"){ el.setAttribute("data-theme","light"); }
  else if(cur==="light"){ el.removeAttribute("data-theme"); }
  else { el.setAttribute("data-theme","dark"); }
}

/* ============================= TOAST / MODAL ============================= */
function toast(msg){
  var stack = document.getElementById("toast-stack");
  var t = document.createElement("div");
  t.className = "toast"; t.textContent = msg;
  stack.appendChild(t);
  setTimeout(function(){ t.style.opacity="0"; t.style.transition="opacity .25s"; setTimeout(function(){ t.remove(); }, 250); }, 2400);
}

function openModal(title, bodyHtml, opts){
  opts = opts || {};
  closeModal();
  var wrap = document.createElement("div");
  wrap.className = "modal-backdrop"; wrap.id = "modal-backdrop";
  wrap.innerHTML =
    '<div class="modal">' +
      '<div class="modal-head"><h3>'+esc(title)+'</h3><button class="icon-btn" data-modal-close>✕</button></div>' +
      '<form id="modal-form">' +
        '<div class="modal-body">'+bodyHtml+'</div>' +
        '<div class="modal-foot">' +
          '<button type="button" class="btn" data-modal-close>Cancelar</button>' +
          '<button type="submit" class="btn btn-primary">'+(opts.submitLabel||"Guardar")+'</button>' +
        '</div>' +
      '</form>' +
    '</div>';
  document.body.appendChild(wrap);
  wrap.addEventListener("click", function(e){ if(e.target===wrap) closeModal(); });
  wrap.querySelectorAll("[data-modal-close]").forEach(function(b){ b.addEventListener("click", closeModal); });
  var form = wrap.querySelector("#modal-form");
  form.addEventListener("submit", function(e){
    e.preventDefault();
    var data = {};
    new FormData(form).forEach(function(v,k){ data[k]=v; });
    if(opts.onSubmit){ var ok = opts.onSubmit(data); if(ok!==false) closeModal(); }
  });
  var firstInput = wrap.querySelector("input,select,textarea");
  if(firstInput) setTimeout(function(){ firstInput.focus(); }, 30);
}
function closeModal(){ var m = document.getElementById("modal-backdrop"); if(m) m.remove(); }

function confirmAction(msg, onYes){

function torreNombre(id){ var t=DB.torres.find(function(x){return x.id===id;}); return t?t.nombre:"—"; }
function deptoLabel(id){ var d=DB.departamentos.find(function(x){return x.id===id;}); if(!d) return "—"; return torreNombre(d.torreId)+" · "+d.piso+"-"+d.numero; }
function deptoById(id){ return DB.departamentos.find(function(x){return x.id===id;}); }
function propietarioNombre(id){ var p=DB.propietarios.find(function(x){return x.id===id;}); return p?p.nombre:"Sin asignar"; }
function areaNombre(id){ var a=DB.areas.find(function(x){return x.id===id;}); return a?a.nombre:"—"; }

function saldoDepto(deptoId){
  return DB.cuotas.filter(function(c){return c.departamentoId===deptoId;})
    .reduce(function(sum,c){ return sum + (c.monto + (c.recargo||0) - c.montoPagado); }, 0);
}
function estadoCuentaDepto(deptoId){
  var s = saldoDepto(deptoId);
  if(s<=0.01) return "al día";
  var venc = DB.cuotas.filter(function(c){return c.departamentoId===deptoId && c.estado!=="pagado" && c.fechaVencimiento < todayISO();});
  return venc.length ? "moroso" : "pendiente";
}
function badgeEstadoCuenta(estado){
  if(estado==="al día") return '<span class="badge badge-success">Al día</span>';
  if(estado==="pendiente") return '<span class="badge badge-warning">Pendiente</span>';
  return '<span class="badge badge-danger">Moroso</span>';
}
function badgeCuota(c){
  if(c.estado==="pagado") return '<span class="badge badge-success">Pagado</span>';
  if(c.estado==="parcial") return '<span class="badge badge-warning">Parcial</span>';
  var vencida = c.fechaVencimiento < todayISO();
  return vencida ? '<span class="badge badge-danger">Vencido</span>' : '<span class="badge badge-info">Pendiente</span>';
}

function cajaBarChart(){
  var months = [];
  for(var i=5;i>=0;i--) months.push(addMonths(todayISO(),-i).slice(0,7));
  var data = months.map(function(m){
    var ing = DB.caja.filter(function(c){return c.tipo==="ingreso"&&c.fecha.slice(0,7)===m;}).reduce(function(s,c){return s+c.monto;},0);
    var egr = DB.caja.filter(function(c){return c.tipo==="egreso"&&c.fecha.slice(0,7)===m;}).reduce(function(s,c){return s+c.monto;},0);
    return {m:m, ing:ing, egr:egr};
  });
  var max = Math.max.apply(null, data.map(function(d){return Math.max(d.ing,d.egr);})) || 1;
  var bars = data.map(function(d){
    var hIng = Math.round(d.ing/max*100);
    var hEgr = Math.round(d.egr/max*100);
    var label = monthLabel(d.m+"-01");
    return '<div class="col">' +
      '<div style="display:flex;gap:3px;align-items:flex-end;height:120px;width:100%;justify-content:center">' +
        '<div title="Ingresos '+esc(label)+': '+fmtBs(d.ing)+'" style="width:12px;height:'+hIng+'%;background:var(--success);border-radius:3px 3px 0 0;min-height:2px"></div>' +
        '<div title="Egresos '+esc(label)+': '+fmtBs(d.egr)+'" style="width:12px;height:'+hEgr+'%;background:var(--danger);border-radius:3px 3px 0 0;min-height:2px"></div>' +
      '</div>' +
      '<div class="lbl">'+esc(label)+'</div>' +
    '</div>';
  }).join("");
  return '<div class="bar-chart">'+bars+'</div>' +
    '<div class="legend"><span><i style="background:var(--success)"></i>Ingresos</span><span><i style="background:var(--danger)"></i>Egresos</span></div>';

function morosidadDonut(ocupados){
  var alDia=0,pend=0,mor=0;
  ocupados.forEach(function(d){
    var e = estadoCuentaDepto(d.id);
    if(e==="al día") alDia++; else if(e==="pendiente") pend++; else mor++;
  });
  var total = ocupados.length || 1;
  var p1 = alDia/total*360, p2 = pend/total*360, p3 = mor/total*360;
  var css = 'conic-gradient(var(--success) 0deg '+p1+'deg, var(--warning) '+p1+'deg '+(p1+p2)+'deg, var(--danger) '+(p1+p2)+'deg '+(p1+p2+p3)+'deg)';
  return '<div class="donut-wrap">' +
    '<div class="donut" style="background:'+css+'"></div>' +
    '<div style="flex:1;min-width:150px">' +
      '<div class="stat-row"><span><span class="badge badge-success" style="margin-right:6px"></span>Al día</span><b class="num">'+alDia+'</b></div>' +
      '<div class="stat-row"><span><span class="badge badge-warning" style="margin-right:6px"></span>Pendiente</span><b class="num">'+pend+'</b></div>' +
      '<div class="stat-row"><span><span class="badge badge-danger" style="margin-right:6px"></span>Moroso</span><b class="num">'+mor+'</b></div>' +
    '</div>' +
  '</div>';
}

        onSubmit:function(data){
          var monto = Math.min(+data.monto, cu.monto+cu.recargo-cu.montoPagado);
          if(monto<=0){ toast("Monto inválido"); return false; }
          cu.montoPagado += monto;
          cu.estado = (cu.monto+cu.recargo-cu.montoPagado) <= 0.01 ? "pagado" : "parcial";
          DB.pagos.push({id:uid("pg"), cuotaId:cu.id, departamentoId:cu.departamentoId, monto:monto, fecha:data.fecha, metodo:data.metodo});
          DB.caja.push({id:uid("cj"), tipo:"ingreso", categoria: cu.concepto==="multa"?"Cobranza multas":"Cobranza cuotas", concepto:conceptoLabel(cu.concepto)+" — "+deptoLabel(cu.departamentoId), monto:monto, fecha:data.fecha});
          persist(); logAudit("Registró pago de "+fmtBs(monto)+" — "+deptoLabel(cu.departamentoId));
          toast("Pago registrado"); renderView("finanzas");
        }
      });
    });
  });
};

/* ============================= CAJA ============================= */
VIEWS.caja = function(){
  var saldo = DB.caja.reduce(function(s,c){return s+(c.tipo==="ingreso"?c.monto:-c.monto);},0);
  var thisMonth = todayISO().slice(0,7);
  var ingresosMes = DB.caja.filter(function(c){return c.tipo==="ingreso"&&c.fecha.slice(0,7)===thisMonth;}).reduce(function(s,c){return s+c.monto;},0);
  var egresosMes = DB.caja.filter(function(c){return c.tipo==="egreso"&&c.fecha.slice(0,7)===thisMonth;}).reduce(function(s,c){return s+c.monto;},0);
  var rows = DB.caja.slice().sort(function(a,b){return b.fecha<a.fecha?-1:1;}).map(function(c){
    return '<tr><td>'+fmtDate(c.fecha)+'</td>' +
      '<td>'+(c.tipo==="ingreso"?'<span class="badge badge-success">Ingreso</span>':'<span class="badge badge-danger">Egreso</span>')+'</td>' +
      '<td>'+esc(c.categoria)+'</td><td>'+esc(c.concepto)+'</td>' +
      '<td class="num" style="color:'+(c.tipo==="ingreso"?"var(--success)":"var(--danger)")+'">'+(c.tipo==="ingreso"?"+":"-")+fmtBs(c.monto)+'</td></tr>';
  }).join("");
  return '' +
  kpiGrid([
    {label:"Saldo de caja", value:fmtBs(saldo), sub:"acumulado", ic:"▣", tone:"info"},
    {label:"Ingresos del mes", value:fmtBs(ingresosMes), sub:thisMonth, ic:"↑", tone:"success"},
    {label:"Egresos del mes", value:fmtBs(egresosMes), sub:thisMonth, ic:"↓", tone:"danger"}
  ]) +
  '<div class="view-head"><div><h2>Movimientos de caja</h2><div class="desc">Ingresos y egresos registrados</div></div>' +
    '<div style="display:flex;gap:8px"><button class="btn" data-add-mov="egreso">+ Egreso</button><button class="btn btn-primary" data-add-mov="ingreso">+ Ingreso</button></div></div>' +
  '<div class="table-wrap"><table><thead><tr><th>Fecha</th><th>Tipo</th><th>Categoría</th><th>Concepto</th><th>Monto</th></tr></thead>' +
  '<tbody>'+(rows||'<tr><td colspan="5" class="empty-row">Sin movimientos.</td></tr>')+'</tbody></table></div>';
};
function movFormHtml(tipo){
  var cats = tipo==="ingreso" ? ["Cobranza cuotas","Cobranza multas","Otros ingresos"] :
    ["Limpieza áreas comunes","Seguridad","Jardinería","Electricidad común","Mantenimiento ascensor","Honorarios administración","Insumos","Otros egresos"];
  return '<div class="field"><label>Categoría</label><select name="categoria">' + cats.map(function(c){return '<option>'+esc(c)+'</option>';}).join("") + '</select></div>' +
    '<div class="field"><label>Concepto / descripción</label><input name="concepto" required></div>' +
    '<div class="field-row">' +
      '<div class="field"><label>Monto (Bs)</label><input type="number" step="0.01" name="monto" required></div>' +
      '<div class="field"><label>Fecha</label><input type="date" name="fecha" value="'+todayISO()+'" required></div>' +
    '</div>';
}
BINDERS.caja = function(){
  var c = document.getElementById("content");
  c.querySelectorAll("[data-add-mov]").forEach(function(btn){
    btn.addEventListener("click", function(){
      var tipo = btn.getAttribute("data-add-mov");
      openModal((tipo==="ingreso"?"Nuevo ingreso":"Nuevo egreso"), movFormHtml(tipo), {
        onSubmit:function(data){
          DB.caja.push({id:uid("cj"), tipo:tipo, categoria:data.categoria, concepto:data.concepto, monto:+data.monto, fecha:data.fecha});
          persist(); logAudit("Registró "+tipo+" de caja: "+data.concepto); toast("Movimiento registrado"); renderView("caja");
        }
      });
    });
  });
};

    var prox = DB.reservas.filter(function(r){return r.areaId===a.id && r.fecha>=todayISO();}).sort(function(x,y){return x.fecha<y.fecha?-1:1;});
    return '<div class="card">' +
      '<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px">' +

        (isResidente ? '<button class="btn btn-sm btn-primary" data-reservar="'+a.id+'">Reservar</button>' : '<button class="btn btn-sm" data-manage-reservas="'+a.id+'">Reservas</button>') +
      '</div>' +
      (prox.length ? '<div class="avail-list">'+prox.slice(0,3).map(function(r){
        return '<div class="avail-item"><span>'+fmtDate(r.fecha)+' · '+r.horaInicio+'–'+r.horaFin+'</span>' +
        (isResidente ? '<span class="muted" style="font-size:12px">'+(r.departamentoId===(misDepto&&misDepto.id)?"Tu reserva":"Reservado")+'</span>' : '<span class="muted" style="font-size:12px">'+esc(deptoLabel(r.departamentoId))+'</span>') +
        '</div>';
      }).join("")+'</div>' : '<p class="muted" style="font-size:12.5px">Sin reservas próximas.</p>') +
    '</div>';
  }).join("");
  return '' +
  '<div class="notice-banner">ⓘ Control de accesos y gestión de proveedores <span class="tag-soon" style="margin-left:6px">próxima ampliación</span></div>' +
  '<div class="view-head"><div><h2>Áreas comunes</h2><div class="desc">Disponibilidad y reservas</div></div></div>' +
  '<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(280px,1fr))">'+cards+'</div>';
};
function reservaFormHtml(areaId, deptoOptions){

        }

/* ============================= REPORTES ============================= */
VIEWS.reportes = function(){
  var ocupados = DB.departamentos.filter(function(d){return d.estado==="ocupado";});
  var cobradoMes = 0, esperadoMes=0;
  var thisMonth = todayISO().slice(0,7);
  DB.cuotas.filter(function(c){return c.periodo===thisMonth && c.concepto==="ordinaria";}).forEach(function(c){
    esperadoMes += c.monto; cobradoMes += Math.min(c.montoPagado,c.monto);
  });
  var pctCobranza = esperadoMes ? Math.round(cobradoMes/esperadoMes*100) : 0;
  var egresosPorCat = {};
  DB.caja.filter(function(c){return c.tipo==="egreso";}).forEach(function(c){ egresosPorCat[c.categoria]=(egresosPorCat[c.categoria]||0)+c.monto; });
  var catRows = Object.keys(egresosPorCat).sort(function(a,b){return egresosPorCat[b]-egresosPorCat[a];});
  var maxCat = Math.max.apply(null, catRows.map(function(k){return egresosPorCat[k];})) || 1;

  return '' +
  '<div class="notice-banner">ⓘ Exportación a PDF/Excel y reportes avanzados <span class="tag-soon" style="margin-left:6px">próxima ampliación</span></div>' +
  '<div class="grid two-col">' +
    '<div class="card"><div class="section-title">Ingresos vs. egresos (6 meses)</div>'+cajaBarChart()+'</div>' +
    '<div class="card"><div class="section-title">Morosidad por unidades</div>'+morosidadDonut(ocupados)+'</div>' +
  '</div>' +
  '<div class="grid two-col" style="margin-top:14px">' +
    '<div class="card">' +
      '<div class="section-title">Cobranza del mes ('+thisMonth+')</div>' +
      '<div class="progress"><div style="width:'+pctCobranza+'%"></div></div>' +
      '<p style="margin-top:8px;font-size:13px" class="muted">'+fmtBs(cobradoMes)+' cobrados de '+fmtBs(esperadoMes)+' esperados (<b class="num">'+pctCobranza+'%</b>)</p>' +
    '</div>' +
    '<div class="card">' +
      '<div class="section-title">Egresos por categoría</div>' +
      catRows.slice(0,6).map(function(k){
        var pct = Math.round(egresosPorCat[k]/maxCat*100);
        return '<div style="margin-bottom:9px"><div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px"><span>'+esc(k)+'</span><b class="num">'+fmtBs(egresosPorCat[k])+'</b></div>' +
          '<div class="progress"><div style="width:'+pct+'%;background:var(--accent)"></div></div></div>';
      }).join("") +
    '</div>' +
  '</div>';
};

BINDERS.usuarios = function(){
  var c = document.getElementById("content");
  c.querySelector("[data-add-user]").addEventListener("click", function(){
    openModal("Nuevo usuario", userFormHtml(), {
      onSubmit:function(data){
        DB.usuarios.push({id:uid("u"), nombre:data.nombre, email:data.email, rol:data.rol, activo:true});
        persist(); logAudit("Creó usuario: "+data.nombre); toast("Usuario creado"); renderView("usuarios");
